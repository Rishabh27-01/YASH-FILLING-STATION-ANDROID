name: Build YASH FILLING STATION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p /tmp/yash
          unzip -o "$ZIP_FILE" -d /tmp/yash

          PROJECT_DIR=$(find /tmp/yash -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle Android project not found in ZIP."
            exit 1
          fi

          echo "PROJECT: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      - name: Correct Supabase project reference
        shell: bash
        run: |
          set -euo pipefail

          OLD_REF='dgxwkzphdvzqyrpgxug'
          NEW_REF='dgxkwkzphdvzqyrpgxug'

          # Update text-based project files, not ZIP archives or build outputs.
          while IFS= read -r -d '' file; do
            if grep -IqF "$OLD_REF" "$file"; then
              sed -i "s/$OLD_REF/$NEW_REF/g" "$file"
              echo "Checked: $file"
            fi
          done < <(
            find app -type f \
              ! -path '*/build/*' \
              -print0 2>/dev/null || true
          )

          echo "Supabase project URL:"
          echo "https://${NEW_REF}.supabase.co"

      - name: Verify Supabase Auth endpoint
        shell: bash
        run: |
          set -euo pipefail

          URL="https://dgxkwkzphdvzqyrpgxug.supabase.co/auth/v1/health"

          echo "Checking: $URL"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --output /tmp/supabase-health.txt \
            --write-out '%{http_code}' \
            "$URL")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/supabase-health.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "ERROR: Supabase endpoint health check failed."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK missing or empty."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YASH-FILLING-STATION-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
