name: Build YASH FILLING STATION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
          echo "ZIP: $ZIP_FILE"

          mkdir -p /tmp/yash
          unzip -o "$ZIP_FILE" -d /tmp/yash

          PROJECT_DIR=$(find /tmp/yash -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          echo "PROJECT: $PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YASH-FILLING-STATION-APK
          path: app/build/outputs/apk/debug/app-debug.apk
